#Smartbox default configuration in TOML format

#version of syntax
version = 1

#global configuration
[global]

#maximum storage 100 MB
storage_max=104857600

# default poll interval of 10 minutes
poll_interval = 600

#max age of files to keep in seconds (3 days)
keep_age_max=259200

# time sync check delay in seconds
time_sync_delay=300

# how often to report vault metrics in seconds (8 hours)
vault_metrics_report_interval=28800

[policies]
    [policies.logs]

    # poll for log changes every second
    poll_interval = 1

    # enroll when size exceeds 2MB or every 10m (if non-empty)
    enroll_size_min = 2097152
    stream_age_limit_ms = 600000

    # max storage occupied by all files inside an artifact destination
    # using this policy (3MB)
    storage_max=3145728

    #max number of files to keep
    count_max=450

    #compress to gz format
    compress="gz"

    #force enroll of files older than 3 days, even if size is smaller than 5KB
    #(this avoids stuck files that don't get a lot of input)
    force_enroll_age = 259200

    #custom vtrace policy
    [policies.vtrace]
    poll_interval = 0
    storage_max=2097152
    count_max=100

    #custom crash policy
    [policies.crash]
    poll_interval = 0
    storage_max=2097152
    count_max=25

    # custom acrreport policy
    # we are placing a maximum capacity of 3MB with 500 maximum acr files. This
    # assumes a maximum of 60 40KB size files.
    [policies.acrreport]
    poll_interval = 0
    storage_max=3145728
    count_max=60

#artifact types must correspond to names as requested by server
[artifactTypes]
    #destination:  /var/lib/data/ace/dropbox/vault/main
    [artifactTypes.main]
        policy="logs"
        importance=10
        # max size 60MB
        storage_max=62914560
        [artifactTypes.main.providers.var_log]
            provider_type="journal"
            syslog_facility="local0"
            journal_output_format="__REALTIME_TIMESTAMP _HOSTNAME SYSLOG_FACILITY.PRIORITY SYSLOG_IDENTIFIER[_PID]: TID MESSAGE"
            journal_wait_timeout_ms = 5000

    #destination:  /var/lib/data/ace/dropbox/vault/system
    [artifactTypes.system]
        policy="logs"
        importance=10
        # max size 15MB
        storage_max=15728640
        [artifactTypes.system.providers.var_log]
            provider_type="journal"
            syslog_facility="daemon"
            journal_output_format="__REALTIME_TIMESTAMP _HOSTNAME SYSLOG_FACILITY.PRIORITY SYSLOG_IDENTIFIER[_PID]: TID MESSAGE"
            journal_wait_timeout_ms = 5000

    #destination:  /var/lib/data/ace/dropbox/vault/crash
    [artifactTypes.crash]
        policy="logs"
        importance=10
        [artifactTypes.crash.providers.var_log]
            provider_type="journal"
            syslog_facility="local1"
            journal_output_format="__REALTIME_TIMESTAMP _HOSTNAME SYSLOG_FACILITY.PRIORITY SYSLOG_IDENTIFIER[_PID]: TID MESSAGE"
            journal_wait_timeout_ms = 5000

    #destination:  /var/lib/data/ace/dropbox/vault/kernel
    [artifactTypes.kernel]
        policy="logs"
        importance=10
        # max size 10MB
        storage_max=10485760
        [artifactTypes.kernel.providers.var_log]
            provider_type = "kmsg"
            path = "/dev/kmsg"
            poll_interval = 0
            # enroll when size exceedes 1M or every 24h (if non-empty)
            enroll_size_min = 1048576
            stream_age_limit_ms = 86400000

    [artifactTypes.SYSTEM_TOMBSTONE]
        policy="crash"
        importance=100
        storage_max=6291456
        count_max=75
        [artifactTypes.SYSTEM_TOMBSTONE.providers.acr]
            path="/var/lib/data/acr/tombstones"
            prefix="crash_"
            suffix=".acr"
            meta_parser="acr"

    [artifactTypes.ACR_REPORT]
        policy="acrreport"
        importance=100
        [artifactTypes.ACR_REPORT.providers.acr]
            path="/var/lib/data/acr/reports"
            prefix="acrreport_"
            suffix=".acr"
            meta_parser="acr"

    [artifactTypes.SYSTEM_LAST_KMSG]
        policy="crash"
        importance=100
        [artifactTypes.SYSTEM_LAST_KMSG.providers.last_kmsg]
            path="/var/log"
            prefix="kern_critical_"
            suffix=".log"
            meta_parser="acr"

    [artifactTypes.SYSTEM_RECOVERY_LOG]
        policy="crash"
        importance=100
        force_enroll_file_copy = 1
        [artifactTypes.SYSTEM_RECOVERY_LOG.providers.system_recovery]
            path = "/cache/recovery"
            prefix="log"

    [artifactTypes.remote_main]
        # Use crash policy and importance for size/count limits and prune protection
        policy="crash"
        importance=100
        [artifactTypes.remote_main.providers.system_restart]
            path = "/var/log/reboot"
            prefix="reboot_log_"
            suffix=".log"

    #destination:  /var/lib/data/ace/dropbox/vault/mcu
    [artifactTypes.mcu]
        policy="logs"
        importance=10
        poll_interval=0
        enroll_size_min=-1
        [artifactTypes.mcu.providers.log]
            path="/var/lib/amf-service/dmc/data/log/"
            prefix="mcu_"
            suffix=".log"

    #destination:  /var/lib/data/ace/dropbox/vault/dsp
    [artifactTypes.dsp]
        policy="logs"
        importance=10
        poll_interval=0
        enroll_size_min=-1
        [artifactTypes.dsp.providers.log]
            path="/var/lib/amf-service/dmc/data/log/"
            prefix="dsp_"
            suffix=".log"

