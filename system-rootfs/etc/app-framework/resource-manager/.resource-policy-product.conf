[resmgr]

version = "0.0.2"

#
# provide the path and the name of the framework cgroup
#
base-cgroup-path = "/sys/fs/cgroup"
framework-cgroup-name = "framework.slice"

#
# product owner defined list of containers
# note that system.slice is treated special where it is set under
# 'base-cgroup-path' and not under 'framework-cgroup-name'

# For headless Vega essential is unused, but leave it here as is.
# RM may have hidden assumptions about existence of essential container.
containers = ["critical", "essential", "multimedia", "voice", "ambient-compute", "background", "service", 'task', 'stem', "system.slice", "background-systemd-service"]
default-container = "essential"

##################################################################
#
# note that the container name 'critical' shall match
# the 'containers' name. In this example 'critical'
#
[container.critical]
#
# list of service that needs to run under the container
#
services = [
  "pkgmgr.service",
  "security-manager.service",
  "service-registrar.service",
  "device-config-manager.service",
  "lifecycle-manager.service",
  "background-work-manager.service",
  "eventmgr.service",
  "stemd.service",
  "notification-manager.service",
]
#
# apps that are pinned to this container
#
pinned-apps = []
#
# memory configuration of the container
#
[container.critical.memory]
#
# Memory usage throttle limit.
# This is the main mechanism to control memory usage of a container.
# If a containers usage goes over the high boundary, the processes
# of the cgroup are throttled and put under heavy reclaim pressure.
# Going over the high limit never invokes the OOM killer and under
# extreme conditions the limit may be breached.
#
high = "max"
#
# Best-effort memory protection or "soft guarantee".  If the memory
# usage of a container is within its effective low boundary, the
# container's memory won't be reclaimed unless there is no reclaimable
# memory available in unprotected (process that are not memory bounded)
# process.    Above the effective low boundary, pages are reclaimed
# proportionally to the overage, reducing reclaim pressure for smaller
# overages.
#
low = "0"
#
# Memory usage hard limit.  This is the final protection mechanism.
# If a container's memory usage reaches this limit and can't be reduced,
# the OOM killer is invoked in the container. Under certain circumstances,
# the usage may go over the limit temporarily.    This is the ultimate
# protection mechanism.  As long as the "memory.high" limit is used
# and monitored properly, this limit's utility is limited to providing
# the final safety net.
#
max = "max"

#
# set the oom score of all process getting to this container
#
oom-adjust-score = "-900"

[container.critical.memory.swap]
#
# The swap usage hard limit. If a conrainer's swap usage reaches
# this limit, anonymous memory of the container will not be swapped
# out; memory that already has swap slots allocated to it can
# continue to be swapped out.
#
max = "max"

[container.critical.cpu]
#
# unit is percentile
#
weight = 20

# assign cpu sets for the container
# It lists the requested CPUs to be used by tasks within this cgroup.
# The actual list of CPUs to be granted, however, is subjected to
# constraints imposed by its parent and can differ from the requested
# CPUs.
# The CPU numbers are comma-separated numbers or ranges.u: 0-4,6,8-10
# An empty value indicates that the cgroup is using the same setting
# as the nearest cgroup ancestor with a non-empty “cpuset.cpus” or all
# the available CPUs if none is found.
[container.critical.cpuset]
cpus = ""

##################################################################
# hyper parameters for container 'essential'
[container.essential]
services = []

[container.essential.memory]
high = "max"
low = "0"
max = "max"

[container.essential.memory.swap]
max = "max"

[container.essential.cpu]
#
# unit is percentile
#
weight = 31

# assign cpu sets for the container
[container.essential.cpuset]
cpus = ""

##################################################################
# hyper parameters for container 'multimedia'
[container.multimedia]
services = [
  "audiosystemservice.service",
  "netsvc.service",
  "dbus.service",
  "tee-supplicant.service",
  "puffinmrmd.service"
]
pinned-apps = []

[container.multimedia.memory]
high = "max"
min = "52428800" #50MB
max = "max"
oom-adjust-score = "-1000"

[container.multimedia.cpu]
weight = 100

##################################################################
# hyper parameters for container 'voice'
[container.voice]
services = [
  "PuffinApp.service",
  "AlexaHybridEngine.service",
  "audioserver.service"
]
pinned-apps = []

[container.voice.memory]
high = "max"
min = "104857600" # 100MB
max = "max"
oom-adjust-score = "-1000"

[container.voice.cpu]
weight = 400

##################################################################
# hyper parameters for container 'ambient-compute'
[container.ambient-compute]
services = [
      "acenna.service",
      "sensor-manager.service",
      "udss-camp-d.service",
      "smarthomed.service",
      "ace_amfd.service",
      "ace_conn_thread.service",
      "datastore.service",
      "ace_zigbee.service",
      "mtk-zb-service.service",
]

[container.ambient-compute.memory]
high = "max"
low = "78643200"
max = "max"
oom-adjust-score = "-900"

[container.ambient-compute.memory.swap]
max = "max"

[container.ambient-compute.cpu]
#
# value in the range of 1 to 10,000
#
weight = 100

##################################################################
# hyper parameters for container 'background'
[container.background]
services = []
pinned-apps = []

[container.background.memory]
high = "max"
low = "0"
max = "max"

[container.background.memory.swap]
max = "max"

[container.background.cpu]
#
# unit is percentile
#
weight = 3

# assign cpu sets for the container
[container.background.cpuset]
cpus = ""

##################################################################
# hyper parameters for container 'background-systemd-service'
[container."background-systemd-service"]
services = ["halo-hub-broker.service", "halo-hub-core.service", "halo-msg-bridge.service", "touchlogger.service",  "perfmonitord.service", "comet.service", "usagestats.service", "halo-init-service.service", "perfrecoveryd.service", "assetmgrd.service", "halo-core-swp.service", "ace_metric_daemon.service", "minerva.service", "acrreport.service", "smartbox.service", "systemd-journald.service"]
pinned-apps = []

[container."background-systemd-service".memory]
high = "max"
low = "0"
max = "max"
oom-adjust-score = "-1000"

[container."background-systemd-service".memory.swap]
max = "max"

[container."background-systemd-service".cpu]
# unit is percentile
