##################################################################
# hyper parameters for container 'system.slice'
## IMPORTANT ## The services defined here should be mutually exclusive with the service list in system.resource
[container."system.slice"]
services = ['Provisionerd.service', 'aacedataKvs.service', 'ace_blemesh.service', 'ace_dioded.service', 'ace_powerd.service', 'ace_thermald.service', 'aceotad.service', 'amakit.service', 'ambienttempd.service', 'android-tools-adbd.service', 'audio-test-buttond.service', 'avahi-daemon.service', 'bluetooth.service', 'conn_socks.service', 'credentialmanager.service', 'dacd.service', 'device-messaging.service', 'download_manager.service', 'factory-reset.service', 'ffs_provisionee.service', 'gadgetsd.service', 'indoor_localization_service.service', 'inputd.service', 'kepler-light.service', 'logconfig-init.service', 'otbr-agent.service', 'powersubservices.service', 'proxy_dnsmasq.service', 'systemd-logind.service', 'systemd-udevd.service', 'timeservice.service', 'tokend.service', 'trackerservice.service', 'usrmgr.service', 'uxeventd.service']
pinned-apps = []

[container."system.slice".memory]
high = "max"
low = "0"
max = "max"
oom-adjust-score = "-1000"

[container."system.slice".memory.swap]
max = "max"

[container."system.slice".cpu]
#
# unit is percentile
#
weight = 42

[app]

[app.type]
interactive = "essential"
service = "service"
task = "task"
stem = 'stem'

[app.state]
[app.state.background]
container = "background"

[app.state.foreground]
container = "essential"

[app.state.stopped]
container = "background"

# application that shall be always in a given power state
[app.power]
#
# list of apps that shall always be power save, these apps should not hold
# display and cpu even if they are in the foreground
#power-save = ["com.amazon.homelauncher.main"]
#display-power-save = []
#cpu-power-save = []

[app.param]
[app.param.weight]
# weight for the state of the app, FG/BG
state = 200
# weight for the type of the app, interactive/service/task 
type = 300
# weight for the service type, stem/non-stem
service-type = 250
# weight based on last used
lru = 100
# oom score as calculated by the kernel
oom-score = 75
# % above of below of the memory budget assigned
mem-budget = 50
# % above of below of the cpu budget assigned
cpu-budget = 50
# weight for the memory used by an app
mem-used = 30
# weight for the cpu used by an app
cpu-used = 5
# weight for app's pinned state
pinned-type = 180

#
# Users can register triggers (onTrimResource()) to be woken up when
# resource pressure exceeds certain thresholds.A trigger describes
# the maximum cumulative stall time over a specific time window,
# e.g. 100ms of total stall time within any 1s window to generate
# a wakeup event.For example, with the default configuration,
# if the memory pressure situation persist for 100ms, resource
# manager will declare it as a memory pressure condition and call
# onTrimResource() of the registered app. It then monitors the
# resourse memory of the PIDs and if the process did not free up
# the memory in ontrimtimeout time, it may decide to kill the
# process to reclaim the memory.
# 'low': 'process-threshold' = 'some'
# The 'some' statistic gives the percentage of time some (one or more) tasks
# were delayed due to lack of resources.
# 'high': 'process-threshold' = 'full'
# The full metric indicates the percentage of time in which all tasks
# were delayed by lack of resources, i.e., the amount of completely unproductive
# time.
#
[pressure.level]
[[pressure.level.memory]]
# pressure level identifier
level = "mid"
# unit is microseconds
threshold-period = "70000"
# unit is microseconds
window-size = "5000000"
# time some (one or more) tasks were delayed due to lack of resources.
process-threshold = "some"
# Below this memory(in kilo bytes) watermark corresponding action(terminate) will be taken
high-watermark = "250000"
# action on pressure
actions = ['log', 'event', 'metric', 'check-app-budget', 'check-service-budget', 'terminate-type-stem', 'terminate-type-task', 'terminate-state-background', 'notify-type-service', 'notify-state-foreground']

[[pressure.level.memory]]
# pressure level identifier
level = "high"
# unit is second
on-trim-timeout = "1"
# unit is microseconds
threshold-period = "5000"
# unit is microseconds
window-size = "5000000"
# indicates the percentage of time in which all tasks were delayed by lack of
# resources
process-threshold = "full"
# Below this memory(in kilo bytes) watermark corresponding action(notify-then-terminate) will be taken
high-watermark = "150000"
# action on pressure
actions = ['log', 'event', 'metric', 'check-app-budget', 'check-service-budget', 'terminate-type-stem', 'terminate-type-task', 'terminate-state-background', 'terminate-type-service', 'terminate-state-foreground']

[[pressure.level.memory]]
# pressure level identifier
level = "low"
# unit is microseconds
threshold-period = "40000"
# unit is microseconds
window-size = "5000000"
# time some (one or more) tasks were delayed due to lack of resources.
process-threshold = "some"
# Below this memory(in kilo bytes) watermark corresponding action(log) will be taken
high-watermark = "350000"
# action on pressure
actions = ['log', 'notify-type-task', 'check-app-budget', 'check-service-budget']

#
# cpu pressure
#
[[pressure.level.cpu]]
# pressure level identifier
level = "high"
# unit is second
on-trim-timeout = "10"
# unit is microseconds
threshold-period = "700000"
# unit is microseconds
window-size = "5000000"
# time some (one or more) tasks were delayed due to lack of resources.
process-threshold = "some"
# percentage of tasks starving for cpu in the last 10s
high-watermark = "90"
# action on pressure
actions = ['log', 'event', 'metric', 'notify-type-task', 'notify-type-service', 'notify-state-background', 'notify-state-foreground']

[[pressure.level.cpu]]
# pressure level identifier
level = "mid"
# unit is second
on-trim-timeout = "3"
# unit is microseconds
threshold-period = "500000"
# unit is microseconds
window-size = "5000000"
# indicates the percentage of time in which all tasks were delayed by lack of
# resources
process-threshold = "some"
# percentage of tasks starving for cpu in the last 10s
high-watermark = "80"
# action on pressure
actions = ['log', 'event', 'notify-type-task', 'notify-type-service', 'notify-state-background']

[[pressure.level.cpu]]
# pressure level identifier
level = "low"
# unit is second
on-trim-timeout = "10"
# unit is microseconds
threshold-period = "100000"
# unit is microseconds
window-size = "5000000"
# time some (one or more) tasks were delayed due to lack of resources.
process-threshold = "some"
# percentage of tasks starving for cpu in the last 10s
high-watermark = "50"
# action on pressure
actions = ['log', 'event', 'notify-type-task', 'notify-type-service', 'notify-state-background']

[pressure.level.swap]
# unit is second
on-trim-timeout = "1"
# value in kb
mem-free-total = 200000
# mem available in kb
mem-available = 200000
# frequency in ms the swap data shall be checked
sample-time = 1000
# number of samples to collect before comparing the vm stat
num-samples = 3
# scale factor for the kswapd watermark: /proc/sys/vm/watermark_scale_factor
# watermark-scale-factor = 20
# vfs_cache_pressure: /proc/sys/vm/vfs_cache_pressure
# vfs_cache_pressure = 200
# swapiness: /proc/sys/vm/swappiness
# swappiness = 50
# actions taken when the free mem is lower than the 'mem-free-total' and available mem is lower than 'mem-available'
pgpgin = 900
pgpgout = 200
pswpin = 20
pswpout = 500
pgsteal_kswapd = 5000
pgsteal_direct = 160
pgscan_kswapd = 6000
pgscan_direct = 500
actions = ['log', 'log-cpu', 'metric', 'check-app-budget', 'check-service-budget', 'terminate-type-stem', 'terminate-type-task', 'terminate-state-background', 'terminate-type-service', 'trim-state-foreground']

# pressure config for device in idle mode
[pressure.level.idle]
# memory config when system enters idle mode
[pressure.level.idle.memory]
# memory watermark for terminate action. idle monitor do not support 'trim' in idle
# only applicable if actions include some kind of "terminate action"
high-watermark = "50000"
# when reclaiming the memory, RM will try to reclaim this amount more than the high watermark
reclaim-watermark = 5000
# action on pressure
actions = ['check-app-budget', 'check-service-budget']

[system]
enable-cpu-control = true

[system.regulate.cpu]
# unit is microseconds
threshold-period = "10000"
# unit is microseconds
window-size = "5000000"
# time some (one or more) tasks were delayed due to lack of resources.
process-threshold = "some"
# action on pressure
services = [
  "PuffinApp.service",
  "puffinmrmd.service",
  "audioserver.service",
  "videoserver.service",
  "ucc.service",
  "mediaserver.service",
  "playerservice.service",
  "dcm.service",
  "drmservice.service",
  "uxeventd.service",
  "netsvc.service",
  "systemd-udevd.service",
]

[system.resource]
# IMPORTANT: The services defined here should be mutually exclusive with the
# service list in [container."system.slice"]. Only include services here for
# which we will change cpu or memory resources. For services where we will
# only change the OOM score, add then in the service list in
# [container."system.slice"]
services = ["PuffinApp.service", "ace_logmgr.service", "smartbox.service", "systemd-journald.service", "minerva.service"]

[system.resource."ace_logmgr.service".memory]
oom-adjust-score = "-1000"
[system.resource."ace_logmgr.service".cpuset]
cpus = "2-3"

[system.resource."PuffinApp.service".memory]
high = "max"
low = "0"
max = "max"
oom-adjust-score = "-1000"
## Restrict PuffinApp swapPSS to 8MB to reduce major page faults
## during memory pressure situations. 8MB is derived from perf
## UPL tests.
[system.resource."PuffinApp.service".memory.swap]
max = "8388608"
[system.resource."PuffinApp.service".cpu]
weight = 142
## enable this flag if the threads are renamed or created after the service is started
## recommended: true
monitor-thread-frequently = true
## configure the thread slices for the puffin service: example
##
# Below not needed for RT priority (fifo or rr); weights are only
# applicable to CFS i.e sched_other
#[[system.resource."PuffinApp.service".cpu.threadslice]]
#name = "high"
#threads = ['audio_to_result', 'PryonKWD', 'MixerMicRST', 'PryonT']
#weight = 6500
#[[system.resource."PuffinApp.service".cpu.threadslice]]
#name = "default"
#weight = 350
##
## thread name and its priority that shall be applied when the app having the given thread name gets
## to the foreground
## name: thread name
## priority: similar to priority value against the deletced scheduling policy. If the policy is not provided,
## default is 'other'
## Available policy options are,
##           rr : SCHED_RR
##           other : SCHED_OTHER
##           fifo : SCHED_FIFO
##
[[system.resource."PuffinApp.service".cpu.thread-config]]
name = 'audio_to_result'
priority = 1
policy = "fifo"
[[system.resource."PuffinApp.service".cpu.thread-config]]
name = 'PryonKWD'
priority = 1
policy = "fifo"
[[system.resource."PuffinApp.service".cpu.thread-config]]
name = 'MixerMicRST'
priority = 1
policy = "fifo"
[[system.resource."PuffinApp.service".cpu.thread-config]]
name = 'PryonT'
priority = 1
policy = "fifo"

[system.resource."systemd-journald.service".memory]
oom-adjust-score = "-1000"
[[system.resource."systemd-journald.service".cpu.thread-config]]
name = 'systemd-journal'
priority = 10
policy = "other"
[system.resource."systemd-journald.service".cpuset]
cpus = "2-3"

[system.resource."smartbox.service".memory]
oom-adjust-score = "-1000"
[system.resource."smartbox.service".cpu]
monitor-thread-frequently = true
[[system.resource."smartbox.service".cpu.thread-config]]
name = 'smartboxd'
priority = 10
policy = "other"

[system.resource."minerva.service".memory]
oom-adjust-score = "-1000"

[debug]
[debug.stats]
# sniff stats data frequency in ms
sampling-time = 60000

psi-pushback = true

# pinning 13 mb to memory to reduce PuffinApp majflts
[memory.pinner]
max-pinnable-memory = 16000
files = [
{name = "usr/lib/libReggaeMediaPlayer.so"},
{name = "usr/lib/libAVSCommon.so"},
{name = "usr/lib/libReggaeDevice.so"},
{name = "usr/lib/libReggaeMediaLib.so"},
{name = "usr/lib/libPuffinUtilities.so"},
{name = "usr/bin/PuffinApp"},
{name = "usr/lib/libreggae-core.so"},
{name = "usr/lib/libacsdkAudioPlayer.so"},
{name = "usr/lib/libSpeechSynthesizer.so"},
{name = "usr/lib/libADSL.so"},
{name = "usr/lib/libACL.so"},
{name = "usr/lib/libAIP.so"},
{name = "usr/lib/libDefaultClient.so"}
]
