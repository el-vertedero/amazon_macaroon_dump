[resmgr]
version = "0.0.2"
base-cgroup-path = "/sys/fs/cgroup"
framework-cgroup-name = "framework.slice"
containers = [
    "critical",
    "essential",
    "multimedia",
    "voice",
    "ambient-compute",
    "background",
    "service",
    "task",
    "stem",
    "system.slice",
    "background-systemd-service",
]
default-container = "essential"

[container.critical]
services = [
    "pkgmgr.service",
    "security-manager.service",
    "service-registrar.service",
    "device-config-manager.service",
    "lifecycle-manager.service",
    "background-work-manager.service",
    "eventmgr.service",
    "stemd.service",
    "notification-manager.service",
]
pinned-apps = []

[container.critical.memory]
high = "max"
low = "0"
max = "max"
oom-adjust-score = "-900"

[container.critical.memory.swap]
max = "max"

[container.critical.cpu]
weight = 20

[container.critical.cpuset]
cpus = ""

[container.essential]
services = []

[container.essential.memory]
high = "max"
low = "0"
max = "max"

[container.essential.memory.swap]
max = "max"

[container.essential.cpu]
weight = 31

[container.essential.cpuset]
cpus = ""

[container.multimedia]
services = [
    "audiosystemservice.service",
    "netsvc.service",
    "dbus.service",
    "tee-supplicant.service",
    "puffinmrmd.service",
]
pinned-apps = []

[container.multimedia.memory]
high = "max"
min = "52428800"
max = "max"
oom-adjust-score = "-1000"

[container.multimedia.cpu]
weight = 100

[container.voice]
services = [
    "PuffinApp.service",
    "AlexaHybridEngine.service",
    "audioserver.service",
]
pinned-apps = []

[container.voice.memory]
high = "max"
min = "104857600"
max = "max"
oom-adjust-score = "-1000"

[container.voice.cpu]
weight = 400

[container.ambient-compute]
services = [
    "acenna.service",
    "sensor-manager.service",
    "udss-camp-d.service",
    "smarthomed.service",
    "ace_amfd.service",
    "ace_conn_thread.service",
    "datastore.service",
    "ace_zigbee.service",
    "mtk-zb-service.service",
]

[container.ambient-compute.memory]
high = "max"
low = "78643200"
max = "max"
oom-adjust-score = "-900"

[container.ambient-compute.memory.swap]
max = "max"

[container.ambient-compute.cpu]
weight = 100

[container.background]
services = []
pinned-apps = []

[container.background.memory]
high = "max"
low = "0"
max = "max"

[container.background.memory.swap]
max = "max"

[container.background.cpu]
weight = 3

[container.background.cpuset]
cpus = ""

[container.background-systemd-service]
services = [
    "halo-hub-broker.service",
    "halo-hub-core.service",
    "halo-msg-bridge.service",
    "touchlogger.service",
    "perfmonitord.service",
    "comet.service",
    "usagestats.service",
    "halo-init-service.service",
    "perfrecoveryd.service",
    "assetmgrd.service",
    "halo-core-swp.service",
    "ace_metric_daemon.service",
    "minerva.service",
    "acrreport.service",
    "smartbox.service",
    "systemd-journald.service",
]
pinned-apps = []

[container.background-systemd-service.memory]
high = "max"
low = "0"
max = "max"
oom-adjust-score = "-1000"

[container.background-systemd-service.memory.swap]
max = "max"

[container.background-systemd-service.cpu]
weight = 5

[container.background-systemd-service.cpuset]
cpus = "1-3"

[container.service]
services = []
pinned-apps = []

[container.service.memory]
high = "max"
low = "0"
max = "max"

[container.service.memory.swap]
max = "max"

[container.service.cpu]
weight = 30

[container.task]
services = []
pinned-apps = []

[container.task.memory]
high = "max"
low = "0"
max = "max"

[container.task.memory.swap]
max = "max"

[container.task.cpu]
weight = 6

[container.stem]
services = []
pinned-apps = []

[container.stem.memory]
high = "max"
low = "0"
max = "max"

[container.stem.memory.swap]
max = "max"

[container.stem.cpu]
weight = 1

[container.stem.cpuset]
cpus = ""

[container."system.slice"]
services = [
    "Provisionerd.service",
    "aacedataKvs.service",
    "ace_blemesh.service",
    "ace_dioded.service",
    "ace_powerd.service",
    "ace_thermald.service",
    "aceotad.service",
    "amakit.service",
    "ambienttempd.service",
    "android-tools-adbd.service",
    "audio-test-buttond.service",
    "avahi-daemon.service",
    "bluetooth.service",
    "conn_socks.service",
    "credentialmanager.service",
    "dacd.service",
    "device-messaging.service",
    "download_manager.service",
    "factory-reset.service",
    "ffs_provisionee.service",
    "gadgetsd.service",
    "indoor_localization_service.service",
    "inputd.service",
    "kepler-light.service",
    "logconfig-init.service",
    "otbr-agent.service",
    "powersubservices.service",
    "proxy_dnsmasq.service",
    "systemd-logind.service",
    "systemd-udevd.service",
    "timeservice.service",
    "tokend.service",
    "trackerservice.service",
    "usrmgr.service",
    "uxeventd.service",
]
pinned-apps = []

[container."system.slice".memory]
high = "max"
low = "0"
max = "max"
oom-adjust-score = "-1000"

[container."system.slice".memory.swap]
max = "max"

[container."system.slice".cpu]
weight = 42

[app.type]
interactive = "essential"
service = "service"
task = "task"
stem = "stem"

[app.state.background]
container = "background"

[app.state.foreground]
container = "essential"

[app.state.stopped]
container = "background"

[app.power]

[app.param.weight]
state = 200
type = 300
service-type = 250
lru = 100
oom-score = 75
mem-budget = 50
cpu-budget = 50
mem-used = 30
cpu-used = 5
pinned-type = 180

[pressure.level]
memory = [
    { level = "mid", threshold-period = "70000", window-size = "5000000", process-threshold = "some", high-watermark = "250000", actions = [
    "log",
    "event",
    "metric",
    "check-app-budget",
    "check-service-budget",
    "terminate-type-stem",
    "terminate-type-task",
    "terminate-state-background",
    "notify-type-service",
    "notify-state-foreground",
] },
    { level = "high", on-trim-timeout = "1", threshold-period = "5000", window-size = "5000000", process-threshold = "full", high-watermark = "150000", actions = [
    "log",
    "event",
    "metric",
    "check-app-budget",
    "check-service-budget",
    "terminate-type-stem",
    "terminate-type-task",
    "terminate-state-background",
    "terminate-type-service",
    "terminate-state-foreground",
] },
    { level = "low", threshold-period = "40000", window-size = "5000000", process-threshold = "some", high-watermark = "350000", actions = [
    "log",
    "notify-type-task",
    "check-app-budget",
    "check-service-budget",
] },
]
cpu = [
    { level = "high", on-trim-timeout = "10", threshold-period = "700000", window-size = "5000000", process-threshold = "some", high-watermark = "90", actions = [
    "log",
    "event",
    "metric",
    "notify-type-task",
    "notify-type-service",
    "notify-state-background",
    "notify-state-foreground",
] },
    { level = "mid", on-trim-timeout = "3", threshold-period = "500000", window-size = "5000000", process-threshold = "some", high-watermark = "80", actions = [
    "log",
    "event",
    "notify-type-task",
    "notify-type-service",
    "notify-state-background",
] },
    { level = "low", on-trim-timeout = "10", threshold-period = "100000", window-size = "5000000", process-threshold = "some", high-watermark = "50", actions = [
    "log",
    "event",
    "notify-type-task",
    "notify-type-service",
    "notify-state-background",
] },
]

[pressure.level.swap]
on-trim-timeout = "1"
mem-free-total = 200000
mem-available = 200000
sample-time = 1000
num-samples = 3
pgpgin = 900
pgpgout = 200
pswpin = 20
pswpout = 500
pgsteal_kswapd = 5000
pgsteal_direct = 160
pgscan_kswapd = 6000
pgscan_direct = 500
actions = [
    "log",
    "log-cpu",
    "metric",
    "check-app-budget",
    "check-service-budget",
    "terminate-type-stem",
    "terminate-type-task",
    "terminate-state-background",
    "terminate-type-service",
    "trim-state-foreground",
]

[pressure.level.idle.memory]
high-watermark = "50000"
reclaim-watermark = 5000
actions = [
    "check-app-budget",
    "check-service-budget",
]

[system]
enable-cpu-control = true

[system.regulate.cpu]
threshold-period = "10000"
window-size = "5000000"
process-threshold = "some"
services = [
    "PuffinApp.service",
    "puffinmrmd.service",
    "audioserver.service",
    "videoserver.service",
    "ucc.service",
    "mediaserver.service",
    "playerservice.service",
    "dcm.service",
    "drmservice.service",
    "uxeventd.service",
    "netsvc.service",
    "systemd-udevd.service",
]

[system.resource]
services = [
    "PuffinApp.service",
    "ace_logmgr.service",
    "smartbox.service",
    "systemd-journald.service",
    "minerva.service",
]

[system.resource."ace_logmgr.service".memory]
oom-adjust-score = "-1000"

[system.resource."ace_logmgr.service".cpuset]
cpus = "2-3"

[system.resource."PuffinApp.service".memory]
high = "max"
low = "0"
max = "max"
oom-adjust-score = "-1000"

[system.resource."PuffinApp.service".memory.swap]
max = "8388608"

[system.resource."PuffinApp.service".cpu]
weight = 142
monitor-thread-frequently = true
thread-config = [
    { name = "audio_to_result", priority = 1, policy = "fifo" },
    { name = "PryonKWD", priority = 1, policy = "fifo" },
    { name = "MixerMicRST", priority = 1, policy = "fifo" },
    { name = "PryonT", priority = 1, policy = "fifo" },
]

[system.resource."systemd-journald.service".memory]
oom-adjust-score = "-1000"

[system.resource."systemd-journald.service".cpu]
thread-config = [
    { name = "systemd-journal", priority = 10, policy = "other" },
]

[system.resource."systemd-journald.service".cpuset]
cpus = "2-3"

[system.resource."smartbox.service".memory]
oom-adjust-score = "-1000"

[system.resource."smartbox.service".cpu]
monitor-thread-frequently = true
thread-config = [
    { name = "smartboxd", priority = 10, policy = "other" },
]

[system.resource."minerva.service".memory]
oom-adjust-score = "-1000"

[debug.stats]
sampling-time = 60000
psi-pushback = true

[memory.pinner]
max-pinnable-memory = 16000
files = [
    { name = "usr/lib/libReggaeMediaPlayer.so" },
    { name = "usr/lib/libAVSCommon.so" },
    { name = "usr/lib/libReggaeDevice.so" },
    { name = "usr/lib/libReggaeMediaLib.so" },
    { name = "usr/lib/libPuffinUtilities.so" },
    { name = "usr/bin/PuffinApp" },
    { name = "usr/lib/libreggae-core.so" },
    { name = "usr/lib/libacsdkAudioPlayer.so" },
    { name = "usr/lib/libSpeechSynthesizer.so" },
    { name = "usr/lib/libADSL.so" },
    { name = "usr/lib/libACL.so" },
    { name = "usr/lib/libAIP.so" },
    { name = "usr/lib/libDefaultClient.so" },
]
