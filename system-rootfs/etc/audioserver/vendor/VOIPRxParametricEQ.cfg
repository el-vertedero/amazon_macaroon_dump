        // Biquad 3. BYPASS
        {
            "FilterType" : "PEAK",
            "Fc"         : 3000,
            "Q"          : 1.2,
            "GaindB"     : -2.0
        },
        // Biquad 4.  Peak to boost frequencies around 2000 Hz by 6dB for Rx FR
        {
            "FilterType" : "HIGH_SHELF",
