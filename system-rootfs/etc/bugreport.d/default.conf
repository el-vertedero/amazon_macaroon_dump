[runplan]
    [runplan.default]
    timeout_ms=360000
        [[runplan.default.step]]
        id="step_cpu_info"
        timeout_ms=10000
            [[runplan.default.step.task]]
            id="task_top"
            plugin="top"
            timeout_ms=5000

        [[runplan.default.step]]
        id="step_mem_info"
            [[runplan.default.step.task]]
            id="task_df"
            plugin="df"

            [[runplan.default.step.task]]
            id="task_du"
            plugin="du"

            [[runplan.default.step.task]]
            id="task_perfdump"
            plugin="perfdump"
            param=["meminfo"]

        [[runplan.default.step]]
        id="step_process_info"
            [[runplan.default.step.task]]
            id="task_ps"
            plugin="ps"

            [[runplan.default.step.task]]
            id="task_vlcm_list"
            plugin="vlcm"
            param=["list"]

            [[runplan.default.step.task]]
            id="task_vlcm_dump"
            plugin="vlcm"
            param=["dump-state"]

            [[runplan.default.step.task]]
            id="task_smartbox_index_stats"
            plugin="smartboxctl"
            param=["get_index_stats"]

        [[runplan.default.step]]
        id="step_input_mic_privacy_state"
            [[runplan.default.step.task]]
            id="task_get_state"
            plugin="inputd-cli"
            param=["get_mic_state"]

        [[runplan.default.step]]
        id="step_input_client_list"
            [[runplan.default.step.task]]
            id="task_get_list"
            plugin="inputd-cli"
            param=["get_client_list"]

        [[runplan.default.step]]
        id="step_power_state"
            [[runplan.default.step.task]]
            id="task_ace_power_stats"
            plugin="ace"

        [[runplan.default.step]]
        id="step_boot_info"
            [[runplan.default.step.task]]
            id="task_lifecyclereason"
            plugin="lifecyclereason"

        [[runplan.default.step]]
        id="step_z"
            [[runplan.default.step.task]]
            id="task_archiver"
            plugin="archiver"

[plugin]
    [plugin.top]
    path="/usr/bin/top"
    param=["-b", "-n", "2"]
    timeout_ms=2000

    [plugin.du]
    path="/usr/bin/du"
    param =["/", "--max-depth=1", "-x"]

    [plugin.df]
    path="/bin/df"

    [plugin.ps]
    path="/bin/ps"

    [plugin.perfdump]
    path="/usr/bin/perfdump"

    [plugin.vlcm]
    path="/usr/bin/vlcm"

    [plugin.smartboxctl]
    path="/usr/bin/smartboxctl"


    [plugin.lifecyclereason]
    path="/bin/cat"
    param=["/sys/kernel/reboot_reason"]
    timeout_ms=2000

    [plugin.archiver]
    path="/usr/bin/bugreport-archiver.sh"
    param=["/var/spool/bugreport", "/var/lib/data/acr/tombstones"]

    [plugin.inputd-cli]
    path="/usr/bin/inputd-cli"

    [plugin.ace]
    path="usr/bin/bugreport-ace-cli.sh"
    param=["ace mw power extcmd power -c stats"]
