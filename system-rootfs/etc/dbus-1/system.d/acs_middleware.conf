<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <policy user="log">
    <allow send_type="method_call" />
    <allow receive_type="method_call"/>
    <allow receive_type="method_return"/>
    <!-- service names defined in global events list -->
    <allow own="com.amazon.logmgr" />
  </policy>
  <policy user="messaging">
    <allow send_type="method_call" />
    <allow receive_type="method_call"/>
    <allow receive_type="method_return"/>
    <!-- service names defined in global events list -->
    <allow own="com.amazon.messaging" />
  </policy>
  <policy user="root">
    <allow send_type="method_call" />
    <allow receive_type="method_call"/>
    <allow receive_type="method_return"/>
    <!-- service names defined in global events list -->
    <allow own="com.lab126.sample0.event" />
    <allow own="com.lab126.sample1.event" />
    <allow own="com.amazon.logmgr_cli_adapter" />
  </policy>
</busconfig>
