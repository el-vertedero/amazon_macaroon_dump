# This file defines the device profile configuration.
[[device-config]]
name = "com.amazon.devconf/system/device-info/profile"
ro-value = "headless"

[[device-config]]
name = "com.amazon.devconf/system/ultrasound-sensor/enablement"
default-value = "ENABLED"
default-access = "r"

[[device-config]]
name = "com.amazon.devconf/system/scene-detection/enablement"
default-value = "DISABLED"
default-access = "r"

[[device-config]]
name = "com.amazon.devconf/system/eeroinsided/eeroinsided-mesh-status"
default-value = "idle"

[[device-config]]
name = "com.amazon.devconf/system/eeroinsided/persist-eri-aipc-mesh-disable"
default-value = "00"

[[device-config]]
name = "com.amazon.devconf/system/eeroinsided/eeroinsided-mesh-disable"
default-value = "000000000000"

[[device-config]]
name = "com.amazon.devconf/system/eeroinsided/eeroinsided-mesh-ap-auth"
default-value = ""

[[device-config]]
name = "com.amazon.devconf/system/eeroinsided/eeroinsided-mesh-ap-ssid"
default-value = ""
