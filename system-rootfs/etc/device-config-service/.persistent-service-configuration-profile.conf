# Persistent services configuration file.
#
# This feature enables specific LCM services to be run persistently.
# For each LCM service the platform/device needs to run persistently, add a [[persistent-services.service]] node as
# shown below.
# Note: Vega performance team needs to approve your service in order to be persistent.
#
# Syntax guide:
# 1. Global feature flag. Can be used to disable this feature (default - enabled).
#       [persistent-services]
#       # Global feature flag. default: true
#       enabled = true

# 2. One or more '[[persistent-services.service]]' nodes.
#    2.a. Static configuration: Add the component ID of the service to be enabled as persistent.
#       # Example Persistent service - Static configuration
#       [[persistent-services.service]]
#       component-id = "com.amazon.aplext.alert.10.service.main"
#
#    2.b. Dynamic configuration: If service is to be enabled conditionally (based on specific DCS configuration), add
#       the component ID of the service, and also define the required DCS config and value in order to be enabled.
#       DCS will enable the feature when the required key is set.
#
#       # Example Persistent service - Dynamic (DCS-based) configuration
#       [[persistent-services.service]]
#       component-id = "com.amazon.taptoalexa.ingress.component.service"
#       config-key = "com.amazon.devconf/system/accessibility/TapToAlexaEnabled"
#       config-required-value = "ENABLED"
#
#       Note: For a dynamically controlled service, you must add the matching device configuration (with a default
#       value) in the separate DCS config file /etc/device-config-service/device-config.conf, see
#       public/docs/DeviceConfigServiceUserGuide.md for details on adding device configurations.
#       Example:
#               /etc/device-config-service/device-config.conf:
#               [[device-config]]
#               name = "com.amazon.devconf/system/accessibility/TapToAlexaEnabled"
#               default-value = "ENABLED"

[persistent-services]
# Global feature flag. default: true
enabled = true

[[persistent-services.service]]
component-id = "com.amazon.commsservice.main"

[[persistent-services.service]]
component-id = "com.amazon.visualindicator.uxeventsvc"
