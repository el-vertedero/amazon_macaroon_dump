[persistent-services]
enabled = true
service = [
    { component-id = "com.amazon.otad.main" },
    { component-id = "com.amazon.dev.shell.service", config-key = "com.amazon.devconf/system/security/developer_mode", config-required-value = "enable" },
    { component-id = "com.amazon.commsservice.main" },
    { component-id = "com.amazon.visualindicator.uxeventsvc" },
    { component-id = "com.amazon.aonlpi.service.main" },
    { component-id = "com.amazon.hl.oobe.main", config-key = "com.amazon.devconf/system/oobe/oobe-enabled", config-required-value = "true" },
]
interLaunchDelay = 500
startDelay = 0
foregroundStartDelay = 0
