# Packaged as part of image composition
#dev-monitor-report default configuration in TOML format

#version of syntax
version = 3

#emmc write threshold (in bytes) for ACR report generation
emmc_acr_threshold = 10737418240 # 10GB

#interval (in seconds) for eMMC metrics collection
#Default: 86400 (24 hours)
emmc_metrics_interval_seconds = 86400

#interval (in seconds) for UBI metrics collection
#Default: 86400 (24 hours)
ubi_metrics_interval_seconds = 86400

#storage key name for total process IO tracking
#Default: "TotalStorageDIn8Hours"
total_storage_key = "TotalStorageDIn8Hours"

#maximum number of top processes to track for IO
#Default: 8
top_process_max_count = 8

#boot time threshold (in seconds) for health checks
#Health checks always run if system boot time is less than or equal to this value
#Default: 30
health_check_mono_time_s = 30

#Optional: Path to test lifetime file (for testing only)
#Uncomment to override the default sysfs lifetime file with a custom test file
#This is used for testing lifetime change detection without affecting real hardware
#Note: Must be in /var/lib/devmonrpt/ or other accessible location (not /tmp due to PrivateTmp=true)
#Default: None (uses system default /sys/block/mmcblk*/device/life_time)
#test_lifetime_file_path = "/var/lib/devmonrpt/test_lifetime_fake.txt"
