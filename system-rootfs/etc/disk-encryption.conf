# list of directories to be encrypted,
# Directories outside of /home will be encrypted with system key
# Directories inside /home will be encrypted with individual key
# The directories are mapped to userdata partition
/var/backups
/var/cache
/var/db
/var/lib
/var/local
/var/log
/var/spool
# /var/non-secure won't be encrypted
/home/root
/home/app_user
/home/weston
