# This file contains system events published by resmgr.

[[system-events]]
# memory pressure event, requesting the subscribers to free memory
topic =  "event://com.amazon.resmgr/pressure/memory/on-trim"

[[system-events]]
# cpu pressure event, requesting the subscribers to release cpu resources 
topic =  "event://com.amazon.resmgr/pressure/cpu/on-trim"

[[system-events]]
topic =  "event://com.amazon.resmgr/pressure/resource"
apps-can-subscribe = true

[[system-events]]
# BWM scheduler event, start scheduling BWM tasks 
topic =  "event://com.amazon.resmgr/schedule/task/start"

[[system-events]]
# BWM scheduler event, stop scheduling BWM tasks 
topic =  "event://com.amazon.resmgr/schedule/task/stop"

[[system-events]]
topic =  "event://com.amazon.resmgr/resource/level"
