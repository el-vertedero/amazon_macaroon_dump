# Allowlist Format:
#
# The priority field supports 2 levels of priority 0, 1
# The higher priority files will be backed up first in the case
# of not enough space in the backup partition.
#
# For files/dir to persist during a shallow Factory Reset
# [[allowlist.shallow]]
# priority = 0
# path = "/var/non-secure/not_so_important_file_to_persist_for_shallow_fr.txt"
#
# [[allowlist.shallow]]
# priority = 1
# path = "/var/lib/very_important_file_to_persist_for_shallow_fr.txt"
#
# Note: the more concise inline TOML format is also supported.
# For example each group will look like:
#
# allowlist.shallow = [
#   {priority = 1, path = "/var/non-secure/very_important_file_to_persist_for_shallow_fr.txt"},
#   {priority = 0, path = "/var/non-secure/not_so_important_file_to_persist_for_shallow_fr.txt"}
# ]
#
# Policy Format:
#
# The type field is the type of policy.
# Currently the policy supported includes: "disable" which disables factory reset when set
# The provider field is where the policy can be read from.
# Only "DCS" (Device Config Service) is currently supported.
# The key field is the key used to read the policy with the provider.
# The value field is the value for which the policy should be enforced.
#
# Event Handler Format:
#
# The event field represents the type of event to be handled and the action field represents 
# the action to be taken when an event occurs.
# Topic is the specific event manager topic to subscribe for the event and the
# value field is the event value that must be received to trigger the event action.
# Currently, the supported event type includes: deregistration, policy_change
# The supported action type includes: factory_reset, no_op, disable_reset
# The event and action field are mandatory.
#
#
# For example, the following configuration factory resets the device when deregistration
# events are received.
# [[event_handlers]]
# event = "deregistration"
# action = "factory_reset"
# topic = "event://{topicName}"
# value = "VALUE_TO_TAKE_ACTION_ON_EVENT"

[[event_handlers]]
event = "deregistration"
action = "factory_reset"

[[event_handlers]]
event = "button_press"
action = "factory_reset"

[[policy]]
type = "disable"
provider = "DCS"
key = "com.amazon.devconf/system/puffin-app/setupModePrivileges"
value = "SetupModeDisabled"

[[event_handlers]]
event = "policy_change"
action = "disable_reset"
topic = "event://com.amazon.devconf/system/puffin-app/setupModePrivileges"
value = "SetupModeDisabled"
# >>>> Beginning of userdata artifacts allowlist configuration
[[allowlist.shallow]]
priority = 0
path = "/var/non-secure/userdata-assets/davs/resources"

[[allowlist.shallow]]
priority = 0
path = "/var/non-secure/userdata-assets/davs/requests"

# <<<< End of user artifacts allowlist configuration
