# inputd default configuration in TOML format

# version of syntax
version = 1

# misc configurations
[inputd]
    # minimum allowable time stamp, based on unix epoch (default: January 1, 2020 - 1577836800)
    min_valid_timestamp_sec=1577836800
    # polling options
    [inputd.polling]
        # maximum allowable delay between inputd polling wakeup and a input event driver time stamp, in microseconds (default: 1000, i.e. 1ms)
        wakeup_delay_warning_threshold_us=1000

# combo configurations
[combos]
    # The acceptable amount of time between button down events for detecting a combo event in milliseconds (default: 300)
    start_tolerance=300

# privacy configuration
[privacy]
    # camera
    [privacy.camera]
        # whether the device has camera hardware (default: false)
        enabled=true
        # whether the device has a physical camera cover switch (default: false)
        cover_hw=false
        # whether camera cover state persists across reboots via KVS (default: false)
        persist_state=false
        [privacy.camera.hysteresis]
            # enable or disable hystersis (default: false)
            enabled=false
            # time to wait before issuing an additional state change event in milliseconds (default: 1000)
            cooldown=1000

    # microphone
    [privacy.microphone]
        # whether the device has microphone hardware (default: false)
        enabled=true
        # whether the device has a physical mic mute switch (default: false)
        mute_hw=true
        # whether mic mute state persists across reboots via KVS (default: false)
        persist_state=true
        # resolve mic mute starting state from KVS instead of hardware switch (default: false)
        start_state_from_kvs=true
        [privacy.microphone.hysteresis]
            # enable or disable hystersis (default: false)
            enabled=false
            # time to wait before issuing an additional state change event in milliseconds (default: 1000)
            cooldown=1000

# log upload configuration
[logupload]
    # enable or disable the running of bug report before log upload execution (default: false)
    generate_bug_report=false
    # time to wait after the log upload combo event, to trigger the log upload process, in milliseconds (default: 2000)
    execution_delay=2000
    # enable or disable the execution of the cloud stream log upload tasks (default: false)
    execute_cloud_stream_log_upload=false

# launch configuration
[launch]
    # how long to wait before a launch retries for the first time (before doubling), in milliseconds (default: 100)
    retry_time=100
    # how long to wait before we stop attempting launches, i.e. the timeout, in milliseconds (default: 10000)
    retry_timeout=10000
    # the number of launch retries to attempt before doubling the sleep (default: 2)
    retries_before_doubling_sleep=2

# suppression configuration
[suppression]
    # enable suppression of key events if the screen is in an off state (default: true)
    suppress_keys_with_screen_off=true

# remap options
[remap_options]
    # whether play and pause buttons should be remapped to a single play/pause button (default: true)
    play_and_pause_to_playpause=true

# remote config (arcus) configuration
[remote_config]
    # partner key config id override (empty = use compile-time default)
    # ship/release config id:
    partner_key_config_id="arn:aws:remote-config:us-west-2:148732287600:appConfig:aezitige"
    # directive config id override (empty = use compile-time default)
    # ship/release config id:
    directive_config_id="arn:aws:remote-config:us-west-2:148732287600:appConfig:a06u7jxn"
