feature = []

[[module]]
id = "/com.amazon.kepler.kepler_compatibility_1@IKeplerCompatibility_0"

# Private, best-effort transitive deps of this TurboModule (queried via TryQueryInterface
# in KeplerCompatibility.cpp). Both are OS-baseline modules, always mounted in the consumer's
# default sandbox, so they are modeled as uses-modules here rather than app-facing needs.
uses-modules = [
  "/com.amazon.kepler.experimental.features_2025_02@IFeature",
  "/com.amazon.kepler.security@ISecurityModule",
]

# 1.1: accepts major.minor version input in isPresentOnOS and isAppTargeting.
# Dependency resolution recurses through includes-modules so _0's uses-modules
# already apply here and are not repeated.
[[module]]
id = "/com.amazon.kepler.kepler_compatibility_1@IKeplerCompatibility_1"
includes-modules = [
  "/com.amazon.kepler.kepler_compatibility_1@IKeplerCompatibility_0",
]

# Kepler Modules help with identifying different minor versions this module supports
# e.g. 1.0, 1.1.
# Note: The major version of a library is up to the library owner.
# It is not expressly tied to the version of KeplerScript it supports, though
# it is a helpful correlation if the native library is not ABI stable. The library
# itself may have reason to bump the major version for unrelated reasons,
# particularly in the case of third party ports whose API is not directly under
# our control. A third party may introduce its own breaking changes apart from
# React Native.
# When adding a new module to existing major version, previous modules must be
# included for backward compatibility. Defining the next version would look like:
# [[module]]
# id = "/com.amazon.kepler.kepler_compatibility_1@IKeplerCompatibility_2",
# includes-modules = [
#   "/com.amazon.kepler.kepler_compatibility_1@IKeplerCompatibility_1",
# ]

[[module]]
id = "/com.amazon.kepler.file_system@IFileSystems"

#
# Copyright (c) 2024-2025 Amazon.com, Inc. or its affiliates.  All rights reserved.
# PROPRIETARY/CONFIDENTIAL.  USE IS SUBJECT TO LICENSE TERMS.
#

[[module]]
id = "/com.amazon.kepler.system.info@ISystemInfoModule"
uses-modules = [
   "/com.amazon.kepler.device_config@IDeviceConfigModule",
   "/com.amazon.kepler.file_system@IFileSystems"
]

[[module]]
id = "/com.amazon.ace.messaging.service@IDeviceMessaging"
includes-messages = [
   "unicast://*/device-messaging/message",
   "unicast://*/device-messaging/payload",
   "unicast://*/com.amazon.device.messaging/message",
   "unicast://*/com.amazon.device.messaging/payload",
   "broadcast://*/com.amazon.messaging/todo/item"
]

# Internal messaging
[[message]]
uri = "unicast://*/device-messaging/message"
sender-privileges = ["self"]
receiver-privileges = ["com.amazon.device-messaging.privilege.internal.access"]

[[message]]
uri = "unicast://*/device-messaging/payload"
sender-privileges = ["self"]
receiver-privileges = ["com.amazon.device-messaging.privilege.internal.access"]

# ADM messaging
[[message]]
uri = "unicast://*/com.amazon.device.messaging/message"
sender-privileges = ["self"]
receiver-privileges = ["com.amazon.device-messaging.privilege.access"]

[[message]]
uri = "unicast://*/com.amazon.device.messaging/payload"
sender-privileges = ["self"]
receiver-privileges = ["com.amazon.device-messaging.privilege.access"]

# TODO messaging
[[message]]
uri = "broadcast://*/com.amazon.messaging/todo/item"
sender-privileges = ["self"]
receiver-privileges = ["*"]

# Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.

# Encode a headless only device feature
[[feature]]
id = "com.amazon.vega.hardware.type.headless"
# Vega OS Version Module
# Encodes OS version as a Kepler capability marker for PackageManager install gating.
# See CDD §8.1: https://wiki.labcollab.net/confluence/display/PROJVEGA/CDD
# See ADR-0011: https://code.amazon.com/packages/VegaOSCompatibilitySpec/blobs/mainline/--/docs/decisions/0011-continuous-os-version-module-lineage.md

# OS 1.1 predates the module system — no module exists for it.
# This is the first module in the chain; includes-modules is intentionally absent.
[[module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[module]]
id = "/com.amazon.vega.os@IVega_2_0"
includes-modules = [
  "/com.amazon.vega.os@IVega_1_2"
]

