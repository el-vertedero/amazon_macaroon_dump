[[stem-manager.family]]
id = "com.amazon.family.minimal"
preload-libraries = [
    { path = "/usr/lib/libvtrace.so.0", init = true },
]
preload-components = [
    "/com.amazon.kepler.vtrace_service"
]

[[stem-manager.family]]
id = "com.amazon.family.native"
preload-libraries = [
    { path = "/usr/lib/libvtrace.so.0", init = true },
]
preload-components = [
    "/com.amazon.kepler.vtrace_service"
]

[app-main-thread-monitoring]
anr-timeout-ms = 45000

[timeout-handler]
enabled = false

# > > > > > Beginning of Headless manual setup mode configuration

[[input-observer.factory-reset]]
input = "factory-reset-oobe"
uri = "orpheus://com.amazon.hl.oobe.main?launchReason=buttonPress"

# < < < < < End of Headless manual setup mode configuration
