schema-version = "0.1"

[process-management]
keep-warm-count = 0

[app-crash-info-buffer]
enabled = true

[app-main-thread-monitoring]
anr-timeout-ms = 45000

[timeout-handler]
enabled = false
default-timeout-long = 86400
default-timeout-short = 30
default-timeout-transient = 10
suspend-on-speech = true
suspend-on-accessibility = true
default-timeout-permanent = -1
reset-on-interaction = true

[timeout-handler.role-sets]
reset = [
    "OVERLAY",
]
suspend = [
    "FULL_SCREEN",
    "PARTIAL_PANEL",
]

[stem-selection]
native-stem-allowlist = [
    "com.amazon.demo-device-kiosk-vega.overlaywindow",
    "com.amazon.freventmgr.test.sub",
    "com.amazon.kepler.netflixta.service.main",
    "com.amazon.kepler.netflixta.service.task.dcs",
    "com.amazon.taptoalexa.eca",
    "com.amazon.tv.systemui.test.request_privilege.main",
    "com.amazon.uifoundation.integrationtest.main",
    "com.amazon.uifoundation.integrationtest.v2.main",
]

[stem-manager]
family = [
    { id = "com.amazon.family.minimal", preload-libraries = [
    { path = "/usr/lib/libvtrace.so.0", init = true },
], preload-components = [
    "/com.amazon.kepler.vtrace_service",
] },
    { id = "com.amazon.family.native", preload-libraries = [
    { path = "/usr/lib/libvtrace.so.0", init = true },
], preload-components = [
    "/com.amazon.kepler.vtrace_service",
] },
]
default-preload-components = [
    "/com.amazon.kepler.vtrace_service",
    "/com.amazon.kepler.experimental.thread_watchdog_2024_03",
    "/com.amazon.kepler.experimental.restoration_manager",
    "/com.amazon.kepler.file_system",
    "/com.amazon.kepler.experimental.device_config_2024_01",
    "/com.amazon.kepler.experimental.asset_resolver_2024_03",
    "/com.amazon.kepler.app_framework.time_zone_handler.time_zone_handler_factory",
    "/com.amazon.kepler.app_framework.asset_configuration_handler.asset_configuration_handler_factory",
    "/com.amazon.kepler.device_config",
    "/com.amazon.kepler.experimental_mr33.messaging",
    "/com.amazon.kepler.security",
]

[lifecycle-state-management]
callback-timeout = 8000

[delegate-enforcement]
delegate-service-enabled = false
always-launch-delegate-for-kids = false
clear-backstack-on-sleep = false
clear-backstack-on-sleep-hours-since-consent = 24

[lifespan-management]
lifespan-policy-delay-ms = 10000

[input-observer]
factory-reset = [
    { input = "factory-reset-oobe", uri = "orpheus://com.amazon.hl.oobe.main?launchReason=buttonPress" },
]
privacy-event = [
    { button-state = "open", privacy-type = "camera", uri = "orpheus://com.amazon.systemui.cameraShutter?status=enabled" },
    { button-state = "closed", privacy-type = "camera", uri = "orpheus://com.amazon.systemui.cameraShutter?status=disabled" },
]
swipe-action = [
    { input = "swipe-down", uri = "orpheus://com.amazon.systemui.statusbar" },
]
power-event = [
    { input = "power-off", uri = "orpheus://com.amazon.systemui.poweroff.main" },
]

[launch-policy-enforcement]
state = "enabled"

[cleanup-policy]
type = "lenient"

[app-activity-service]
package-usage-cache-size = 1000
foreground-event-cache-size = 15

[display-logic]
ignore-display-updates = false
source = "display-server"
terminate-ambient-component = true

[app-prelaunch]
enabled = false
use-NAP = false

[wake-logic]
reset-backstack-timeout = 0

[restriction-enforcement]
enabled = false
legacy-delegate-flow = true

[foreground-app-trim-policy]
type = "lenient"
