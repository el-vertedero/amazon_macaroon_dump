# This file defines product specific default application components for
# categories such as launcher. The category should also be listed in the
# manifest under that component. This list is used as factory defaults. The
# defaults maybe overriden by the system at runtime through
# PackageManager::setDefaultComponent() API.
# 
# Example,
# [[default-component]]
# category = "com.amazon.category.launcher"
# component-id = "com.amazon.mm.oobe.main"
#
# This file is exported into /etc/pkgmgrd/ on the device.
#
# The default application components maybe different for each of the products.
# So these are expected to be defined by the respective product teams using
# Yocto app-framework.bbapend as follows.
#
# Example, meta-xxx/recipes-core/app-framework/app-framework.bbappend can have
#
# do_install_append() {
#    cat >> ${D}/etc/pkgmgrd/factory-default-components.conf <<EOF
# 
# [[default-component]]
# category = "com.amazon.category.launcher"
# component-id = "com.amazon.mm.oobe.main"
# 
# EOF
# }
