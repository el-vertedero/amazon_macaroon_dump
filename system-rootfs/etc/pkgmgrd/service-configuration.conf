    { id = "Vega Platform App Distributor Signer", path = "/etc/pkgmgrd/certs/release/privilege/release-platform-ca.pem", digest = "0C:7B:6D:D1:FB:47:C8:89:30:6E:C1:51:ED:7F:63:55:DF:F6:74:88:5A:9E:60:E4:6A:C2:C8:CB:17:D1:C9:5B" },
]
debug-platform-signers = [
    { id = "Platform CA", path = "/etc/pkgmgrd/certs/debug/debug-distributor-ca.pem", digest = "BD:91:18:D6:1A:AA:EC:00:44:A2:BC:BB:85:9E:B1:38:9B:E6:D1:F8:6E:3C:4C:E4:05:35:3C:A2:01:9E:D6:08" },
    { id = "Developer CA", path = "/etc/pkgmgrd/certs/debug/debug-developer-ca.pem", digest = "E8:D9:C9:B9:B0:A4:84:49:A4:82:A5:A9:25:74:5C:7F:40:D6:1B:F1:C1:15:3A:45:B3:D2:78:C2:3A:61:44:E2" },
    { id = "Debug Distributor CA", path = "/etc/pkgmgrd/certs/debug/debug-platform-ca.pem", digest = "1C:66:89:2A:F8:15:56:CF:7C:4D:78:29:BC:14:AB:EA:28:66:47:6B:55:E6:D0:14:03:27:81:29:F8:10:F0:A9" },
]
app-store-signers = [
    { path = "/etc/pkgmgrd/certs/release/distributor/amazon-appstore-root-ca.pem", digest = "F9:40:71:E2:9D:95:AD:1B:5E:3B:64:40:98:FA:26:BE:DF:61:83:12:8C:9F:42:2A:6B:0E:25:9C:EF:11:66:93" },
    { id = "app-store", path = "/etc/pkgmgrd/certs/release/distributor/release-dns-root-ca.pem", digest = "2B:11:58:71:33:3B:AF:D1:89:69:03:17:8C:68:A2:AC:32:AA:98:AE:9B:54:76:44:0C:36:8A:79:44:53:37:73", certificate_subjects = [
    "O = Amazon.com Services LLC, OU = Amazon Appstore, CN = Amazon Appstore, L = Seattle, ST = Washington, C = US, 1.3.6.1.4.1.4843.1.1 = AS01",
    "O = Amazon.com Services Inc, OU = Amazon Appstore, CN = Amazon Appstore Issuer CA 1, C = US, ST = Washington, L = Seattle, 1.3.6.1.4.1.4843.1.3 = A2F03VAYH3NC5M",
    "C = US, O = Amazon.com Services Inc, OU = Amazon Devices and Services, ST = Washington, CN = Amazon Devices and Services Appstore Intermediate CA, L = Seattle",
], allow_trailing_digits = true },
]

[signature-verification]
allow-unsigned = true
legacy-digest = true
platform-signature-required = [
    "com.amazon.webview",
    "com.amazon.cloud9",
]

[uri-resolver]
temp-allow-fos-uris = true

[startup-validation]
enabled = true

[system-modules]
default-system-modules-list = [
    "/com.amazon.kepler.device_config@IDeviceConfigModule",
    "/com.amazon.kepler.experimental.device_config_2024_01@IDeviceConfig",
    "/com.amazon.kepler.os_messages@IOsMessageModule",
]

[launch-hints]
is-launch-hints-resolution-enabled = true
