# Service migration mappings for Package Manager.
# Maps old service IDs to replacement module IDs.
#
# When PM detects a package with wants/needs for an old service ID listed here,
# it auto-adds the mapped module to the package's wants.modules. The module's
# uses-services provides the new service ID to Service Registrar.
#
# Teams should file a request with the PM team to add new mappings.
#
# Format:
#   [[service-migration-mappings]]
#   service-id = "com.amazon.old.service"
#   module-id = "/com.amazon.new.module@IMod1"

# Test-only mapping: uses test package IDs that only exist in integration tests.
[[service-migration-mappings]]
service-id = "com.amazon.pm.test.old.service"
module-id = "/com.amazon.pm.offers.module@IMod1"

[[service-migration-mappings]]
service-id = "com.amazon.tv.developer.dataservice"
module-id = "/com.amazon.tv.developer.dataservice@IAlbertoServiceIpc"

[[service-migration-mappings]]
service-id = "com.amazon.softwareupdate.service"
module-id = "/com.amazon.otad@IOta"

[[service-migration-mappings]]
service-id = "com.amazon.mediatransform.service"
module-id = "/com.amazon.kepler.media_transform@IMediaFactory"
