[power-service-config]
#The version of this config file
schema-version = "0.1"
# Provide the shutdown-timeout(seconds) value.
#  0 -- means not support shutdown dealy
#  greater than 0 -- means set the maximum shutdown delay timeout for components to finish shutdown preparation before device cut off power.
shutdown-delay-maximum = 20
# The minimum shutdown delay(Seconds) to allow system components finish shutdown preparation.
# For example, splash-service need to show some messge on UI to customer before shutdown, which need a minimum shutdown delay.
shutdown-delay-minimum = 5
# If device enter STR failed,
# 0 -- Not support
# 1 -- Shutdown
# 2 -- Reboot
# 3 -- Return failure to API caller
STR-failed-behavior = 1
#System Power State Machine related config
allow-audio-in-low-power-mode = true
[power-state-machine]
#Enable/disable the power state machine
enabled = false
#Supported power state in state machine
#The valid state include: "ACTIVE", "IDLE", "STANDBY", "SUSPEND", "HIBERNATE", "POWER_OFF"
[[power-state-machine.supported-state]]
state = "ACTIVE"
# allow-transition-to-state - the allowed system power states that this state can transit to.
# auto-transition-timeout - the default timeout in ms for a transition timer used by the current state to auto-transit to an allowed power state.
#                           "-1" means auto state transition not allowed, otherwise the timeout value should be greater than 0.
# before-listener-timeout - the maximum listener callback waiting time in ms by the power-service.
#                           "0" value indicates non-blocking callbacks are processed (no waiting),
#                           a value greater than 0 indicates blocking callbacks are processed.
allow-transition-to-state = ["IDLE", "STANDBY"]
auto-transition-timeout = [10000, 30000]
before-listener-timeout = 5000
#The valid value include: "release", "powersave", "normal", "performance"
components = [
    {name = "DISPLAY", value-in-range = ["normal"]},
    {name = "CPU", value-in-range = ["normal", "performance"]}]
[[power-state-machine.supported-state]]
state = "IDLE"
allow-transition-to-state= ["ACTIVE", "STANDBY"]
auto-transition-timeout = [-1, 300000]
before-listener-timeout = 5000
components = [
    {name = "DISPLAY", value-in-range = ["powersave", "normal"]}]
[[power-state-machine.supported-state]]
state = "STANDBY"
allow-transition-to-state = ["ACTIVE"]
auto-transition-timeout = [-1]
before-listener-timeout = 5000
components = [
    {name = "DISPLAY", value-in-range = ["release"]},
    {name = "CPU", value-in-range = ["powersave"]}]
#end of config
