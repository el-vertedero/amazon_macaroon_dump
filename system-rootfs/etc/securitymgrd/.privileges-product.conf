#
# "Security assessment mandatory" =/= "completed ASR application"
# Changes to this file require CR approval by a member of the
# vega-security team: https://permissions.amazon.com/a/team/vega-security
[[system-privileges]]
name = "com.amazon.remoteproc.crash.stats"
description = "Allows to read remoteproc status"
type = "install-time"
paths = ["/sys/devices/platform/1fff000.rproc/remoteproc/remoteproc0/"]
options = [["--read-only"]]
[[system-privileges.requires]]
type = "signature"
id = "com.amazon.privilege-signer.platform"

[[system-privileges]]
name = "com.amazon.amf.state.stats"
description = "Allows to read amf status"
type = "install-time"
paths = ["/sys/kernel/amf/"]
options = [["--read-only"]]
[[system-privileges.requires]]
type = "signature"
id = "com.amazon.privilege-signer.platform"

[[system-privileges]]
name = "com.amazon.cerulean.privilege.service"
description = "Privilege to access Cerulean Vega Service"
type = "install-time"
[[system-privileges.requires]]
type = "signature"
id = "com.amazon.privilege-signer.platform"

# Write privileges for Accessibility group
[[system-privileges]]
name = "com.amazon.devconf.privilege.accessibility.write"
type = "install-time"
[[system-privileges.requires]]
type = "signature"
id = "com.amazon.privilege-signer.platform"

# Read privileges for the Messaging service
[[system-privileges]]
name = "com.amazon.messaging.privilege.read"
type = "install-time"
[[system-privileges.requires]]
type = "signature"
id = "com.amazon.privilege-signer.platform"

# Write privileges for the Messaging service
[[system-privileges]]
name = "com.amazon.messaging.privilege.write"
type = "install-time"
[[system-privileges.requires]]
type = "signature"
id = "com.amazon.privilege-signer.platform"

# Write privileges for PuffinApp
[[system-privileges]]
name = "com.amazon.devconf.privilege.puffin-app.ambient.write"
type = "install-time"
[[system-privileges.requires]]
type = "signature"
id = "com.amazon.privilege-signer.platform"

[[system-privileges]]
name = "com.amazon.edgeaiinference.privilege.qcdsp.access"
description = "Provides access to required QC hardware resources and DSP devices"
type = "install-time"
paths = [
    "/sys/devices/soc0/soc_id",
    "/dev/aud_pasthru_adsp",
    "/dev/fastrpc-adsp-secure",
    "/dev/fastrpc-cdsp",
    "/dev/fastrpc-cdsp-secure",
    "/dev/fastrpc-cdsp1",
    "/dev/fastrpc-cdsp1-secure",
    "/dev/fastrpc-gdsp0",
    "/dev/fastrpc-gdsp0-secure",
    "/dev/fastrpc-gdsp1",
    "/dev/fastrpc-gdsp1-secure",
    "/dev/dma_heap/system"
]
options = [
    ["--read-only"],
    ["--read-only"],
    ["--read-only"],
    ["--read-only"],
    ["--read-only"],
    ["--read-only"],
    ["--read-only"],
    ["--read-only"],
    ["--read-only"],
    ["--read-only"],
    ["--read-only"],
    ["--read-only"]
]
[[system-privileges.requires]]
type = "signature"
id = "com.amazon.privilege-signer.platform"

# React Native Application Runtime (RNAR) deeplink invocation
[[system-privileges]]
name = "com.amazon.rnar.privilege.deeplink.invoke"
description = "Allows apps to launch RNAR bundles via deeplink URI"
type = "install-time"
[[system-privileges.requires]]
type = "signature"
id = "com.amazon.privilege-signer.platform"

# Ambient surfer deeplink invocation
[[system-privileges]]
name = "com.amazon.ambientsurfer.privilege.deeplink.invoke"
description = "Allows apps to launch ambient surfer via deeplink URI"
type = "install-time"
[[system-privileges.requires]]
type = "signature"
id = "com.amazon.privilege-signer.platform"

[runtime-privileges-support]
default-state = "allow"