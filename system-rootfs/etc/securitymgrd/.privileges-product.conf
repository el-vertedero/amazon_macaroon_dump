# This file contains predefined ("system-defined") app privileges, which may be granted to apps
# which declare a dependency on them in their manifest and common configuration details for
# sandboxing an application
#
# While some apps may define privileges in their manifests, privileges defined in this file are
# slightly different, as they may confer extra properties onto apps which modify their sandbox.
#
# The list of supported keys for a given privilege are, for the moment, is as such:
#   * 'name' - The name of the privilege.
#   * 'type' - The type of privilege. Right now, the only supported type is "install-time".
#   * 'groups' - Supplemental groups to grant to an app when it's spawned.
#   * 'paths' - Paths to include in the mount namespace of an app's sandbox.
#   * 'permissive' - A boolean flag indicating if this privilege has to be allowed even the
#                    package doesn't declare the dependency in it's manifest.
#   * 'default-state' - An optional field for "run-time" privileges. When this is not set, the
#                       privilege will be in the "deny" state for each application until it is
#                       explicitly set to "allow". Setting this option to "allow" will cause the
#                       privilege to default to the "allow" state for each application.
#   * 'override' - A device config service key that can be used to disable the
#                  privilege for all applications. Once supported, this option
#                  will only be valid for "run-time" type privileges. The value
#                  associated with the DCS key must be "1" for the privilege to
#                  be granted to any application. All values other than "1" and
#                  no value will cause all checks for the permission to be
#                  denied.

