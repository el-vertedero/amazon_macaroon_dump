# This file contains bindmounts configuration for stem-family com.amazon.family.webview
# stem-family com.amazon.family.webview is used by chromium/webview renderer process
# for providing the sandbox thats required the renderer process

[[sandbox-config.bind-mount-paths]]
path = "/usr/share/webview"
options = ["--read-only"]

# Needed for communicating with ServiceRegistrar
[[sandbox-config.bind-mount-paths]]
path = "/var/lib/data/ace/aipc/32"
options = ["--read-write"]

[[sandbox-config.bind-mount-paths]]
path = "/proc/self/attr/current"
options = ["--read-write"]

[[sandbox-config.bind-mount-paths]]
path = "/run/systemd/journal/socket"
options = ["--read-write"]

[[sandbox-config.bind-mount-paths]]
path = "/dev/urandom"
options = ["--read-only"]

[[sandbox-config.bind-mount-paths]]
path = "/sys/devices/system/cpu"
options = ["--read-only"]

# todo: Remove /usr/lib/ bind mounts in APPFWK-8081
[[sandbox-config.bind-mount-paths]]
path = "/usr/lib/"
options = ["--read-only"]

[[sandbox-config.bind-mount-paths]]
path = "/usr/lib/omnikit/"
options = ["--read-only"]

[[sandbox-config.bind-mount-paths]]
path = "/dev/binder"
options = ["--read-write"]
