app-rules-template = [
    { rules = [
    "System ~PROCESS~ rwxat--",
    "System::Privileged ~PROCESS~ rwxat--",
    "~PROCESS~ System -w-----",
    "~PROCESS~ System::Privileged -w-----",
    "~PROCESS~ System::Shared r-x--l-",
    "~PROCESS~ System::Run rwxat--",
    "~PROCESS~ System::Log rwxa---",
    "User ~PROCESS~ rwxat--",
    "~PROCESS~ User -wx----",
    "~PROCESS~ User::Home r-x--l-",
    "~PROCESS~ User::App::Shared rwx----",
    "User::App::Shared ~PROCESS~ -w-----",
    "~PROCESS~ ~PATH_RW~ rwxat--",
    "~PROCESS~ ~PATH_RO~ r-x--l-",
    "System ~PATH_RW~ rwxat--",
    "System ~PATH_RO~ rwxat--",
    "System::Privileged ~PATH_RW~ rwxat--",
    "System::Privileged ~PATH_RO~ rwxat--",
    "System::Open ~PROCESS~ rwxat--",
    "~PROCESS~ System::Open rwx----",
    "System::NNA ~PROCESS~ rwxat--",
    "System::NNA ~PATH_RW~ rwxat--",
    "System::NNA ~PATH_RO~ rwxat--",
    "~PROCESS~ System::NNA rwx----",
    "~PROCESS~ System::ipc rwxat--",
    "System::Stem ~PROCESS~ rwx----",
    "~PROCESS~ System::Stem -w-----",
    "~PROCESS~ User::Shell r-x----",
] },
]
privilege-signers = [
    { id = "com.amazon.privilege-signer.platform", common_name = "Platform Distributor CA", digest = "0C:7B:6D:D1:FB:47:C8:89:30:6E:C1:51:ED:7F:63:55:DF:F6:74:88:5A:9E:60:E4:6A:C2:C8:CB:17:D1:C9:5B", path = "/etc/pkgmgrd/certs/release/privilege/release-platform-ca.pem" },
    { id = "com.amazon.privilege-signer.platform.debug", common_name = "Debug Distributor CA", digest = "1C:66:89:2A:F8:15:56:CF:7C:4D:78:29:BC:14:AB:EA:28:66:47:6B:55:E6:D0:14:03:27:81:29:F8:10:F0:A9", path = "/etc/pkgmgrd/certs/debug/debug-platform-ca.pem", debug_signer = true },
    { id = "com.amazon.privilege-signer.distributor.amazon-appstore", common_name = "Amazon Appstore Root CA 1", digest = "F9:40:71:E2:9D:95:AD:1B:5E:3B:64:40:98:FA:26:BE:DF:61:83:12:8C:9F:42:2A:6B:0E:25:9C:EF:11:66:93", path = "/etc/pkgmgrd/certs/release/distributor/amazon-appstore-root-ca.pem" },
    { id = "com.amazon.privilege-signer.distributor.release-dns", common_name = "Amazon Devices and Services Root CA", digest = "2B:11:58:71:33:3B:AF:D1:89:69:03:17:8C:68:A2:AC:32:AA:98:AE:9B:54:76:44:0C:36:8A:79:44:53:37:73", path = "/etc/pkgmgrd/certs/release/distributor/release-dns-root-ca.pem" },
]
system-privileges = [
    { name = "com.amazon.security.example1", type = "install-time", groups = [
    "graphics",
    "989",
] },
    { name = "com.amazon.security.example2", type = "install-time", groups = [
    "audio",
], paths = [
    "/var/run/tmp-workaround-audio-deleteme",
] },
]

