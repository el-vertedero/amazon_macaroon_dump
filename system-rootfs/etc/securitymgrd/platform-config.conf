[sandbox-config.config-params]
syscall_filtering = true
sm_cache_enabled = true
sm_cache_size = 16

[sandbox-config.debug]
bind-mount-paths = [
    { path = "/usr/bin/strace", options = [
    "--read-only",
] },
    { path = "/usr/bin/gdbserver", options = [
    "--read-only",
] },
    { path = "/usr/bin/valgrind", options = [
