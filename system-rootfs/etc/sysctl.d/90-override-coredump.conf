#overrides /usr/lib/sysctl.d/50-coredump.conf
#kernel.core_pattern=|/lib/systemd/systemd-coredump %P %u %g %s %t %c %h
#needed for acr_crash_dump to handle core dumps
#place this in /etc/sysctl.d/90-override-coredump.conf
#see https://man7.org/linux/man-pages/man5/core.5.html
#

#set core handler to ACR
#MEMO: if changing this, also update: switch_core_handler
kernel.core_pattern=|/usr/bin/acr_core_dump_script %P %t %u %g %i %c %s %e %E

#must be >0, otherwise ACR core handler cannot read /proc/<PID> dir
kernel.core_pipe_limit=2

# Allow non-root core, ref: ACE-50598
fs.suid_dumpable=2
