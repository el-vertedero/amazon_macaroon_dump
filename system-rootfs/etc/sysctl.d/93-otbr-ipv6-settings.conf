# Set IPv6 related parameters. Openthread interface requires
# forwarding of ipv6 packets for border router functionality.
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.wlan0.accept_ra = 2
net.ipv6.conf.wlan0.forwarding = 1
net.ipv6.conf.wlan0.accept_redirects = 1
net.ipv6.conf.wlan0.accept_source_route = 1
net.ipv6.conf.eth0.accept_ra = 2
net.ipv6.conf.eth0.forwarding = 1
net.ipv6.conf.eth0.accept_redirects = 1
net.ipv6.conf.eth0.accept_source_route = 1
net.ipv6.conf.ot0.accept_ra = 2
net.ipv6.conf.ot0.forwarding = 1
net.ipv6.conf.ot0.accept_redirects = 1
net.ipv6.conf.ot0.accept_source_route = 1