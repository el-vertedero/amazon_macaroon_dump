#
# See journald.conf(5) for details.

[Journal]
Storage=volatile
#Compress=yes
#Seal=yes
#SplitMode=uid
#SyncIntervalSec=5m
RateLimitIntervalSec=1s
RateLimitBurst=300
#SystemMaxUse=
#SystemKeepFree=
#SystemMaxFileSize=
#SystemMaxFiles=100
RuntimeMaxUse=4M
#RuntimeKeepFree=
RuntimeMaxFileSize=2M
RuntimeMaxFiles=2
#MaxRetentionSec=
#MaxFileSec=1month
ForwardToSyslog=no
#ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
#TTYPath=/dev/console
MaxLevelStore=info
MaxLevelSyslog=info
#MaxLevelKMsg=notice
#MaxLevelConsole=info
#MaxLevelWall=emerg
LineMax=2K
ReadKMsg=no
Audit=no
