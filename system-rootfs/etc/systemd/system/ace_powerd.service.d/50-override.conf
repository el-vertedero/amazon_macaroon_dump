[Service]
SupplementaryGroups=system cpufreq
ExecStartPre=-+/bin/chown -R root:system /sys/power
ExecStartPre=-+/bin/chmod -R g+rw /sys/power
ExecStartPre=-+/bin/chown cpufreq:cpufreq /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
ExecStartPre=-+/bin/chmod g+rw /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor

# reboot syscall needed
CapabilityBoundingSet=CAP_SYS_BOOT
AmbientCapabilities=CAP_SYS_BOOT
