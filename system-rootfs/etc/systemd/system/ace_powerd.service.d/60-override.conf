[Unit]
OnFailure=failure-manager@%N.service

[Service]
ExecStartPre=-+/bin/chown root:system /sys/kernel/quiescent/s-ota
ExecStartPre=-+/bin/chmod g+rw /sys/kernel/quiescent/s-ota

ExecStartPre=+/bin/bash -c '\
    if [ -f "/sys/kernel/debug/wakeup_sources" ]; then \
        /bin/chgrp debugfs /sys/kernel/debug; \
        /bin/chmod g+rx /sys/kernel/debug; \
    fi'

ExecStart=
ExecStart=/usr/bin/powerd

