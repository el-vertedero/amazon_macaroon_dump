[Service]
# allows the process to block suspend
CapabilityBoundingSet=CAP_BLOCK_SUSPEND
AmbientCapabilities=CAP_BLOCK_SUSPEND
# allow access to /dev/shm to allow using sem_open
ReadWritePaths=/dev/shm

# allow access to debugfs
SupplementaryGroups=debugfs

ExecStartPre=+/bin/bash -c '\
    if [ -f "/sys/kernel/debug/suspend_latency" ]; then \
        /bin/chgrp debugfs /sys/kernel/debug; \
        /bin/chmod g+rx /sys/kernel/debug; \
    fi'
