[Unit]
PartOf=aceotad.service

[Service]
# Reset previous configuration
# DO NOT remove the below lines.
User=
Group=
CapabilityBoundingSet=CAP_SYS_RESOURCE CAP_SYS_ADMIN CAP_MAC_OVERRIDE
AmbientCapabilities=CAP_SYS_RESOURCE CAP_SYS_ADMIN CAP_MAC_OVERRIDE

# Set the new user/group for swupdate
User=ota
SupplementaryGroups=disk ota

SmackProcessLabel=System::Privileged

# Use /run/swupdate for temporary
# swupdate cache.
Environment=TMPDIR=/run/swupdate
