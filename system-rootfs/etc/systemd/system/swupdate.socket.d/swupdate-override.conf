[Socket]
SocketUser=ota
SocketGroup=ota

SocketMode=0660

# Override the Socket path to use /run/swupdate/
# We need this because we like to control all the
# OTA files within its own tmpfs, so that a bug
# or memory leak in /tmp should not impact OTA

ListenStream=
ListenStream=/run/swupdate/sockinstctrl
ListenStream=/run/swupdate/swupdateprog
