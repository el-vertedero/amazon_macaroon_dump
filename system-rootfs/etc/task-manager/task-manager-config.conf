[messages-restriction-list]
messages-list = [
    "broadcast://*/com.amazon.kepler.lifecycle_management/state-change/launch",
    "broadcast://*/com.amazon.kepler.lifecycle_management/state-change/start",
    "broadcast://*/com.amazon.kepler.lifecycle_management/state-change/stop",
    "broadcast://*/com.amazon.kepler.lifecycle_management/state-change/foreground",
    "broadcast://*/com.amazon.kepler.lifecycle_management/state-change/background",
]

[packages-allowlist]
package-list = [
    "com.amazon.cloudstreaming.background.work",
    "com.amazon.kcp",
    "com.amazon.mm.setting",
    "com.amazon.systemtest.bwm.service",
    "com.amazon.spotlight",
    "com.amazon.devicecontrolnativeservice",
    "com.amazon.livedeviceservice",
    "com.amazon.nativeroutingservice",
    "com.amazon.datastore.sampleapp.launcher",
    "com.amazon.tv.developer.dataservice",
    "com.amazon.sample.background.work",
    "com.amazon.test.task.manager",
    "com.amazon.appfwk.tm.app.sample",
]

[messaging-allowlist]
package-list = [
    "com.amazon.appstorevegatv.native",
    "com.amazon.device_name_sync",
    "com.amazon.test.task.manager",
    "com.amazon.appfwk.tm.app.sample",
]

[bwm-service-config-params]
work-scheduling-period-secs = 1
work-timeout-period-mins = 5
max-parallel-work-launches = 5
work-minimum-delay-secs = 60
max-failed-launch-retry-attempts = 8
retry-power-base-value = 4
max-parallel-urgent-launches = 3
max-completed-work-size-per-package = 20
max-cancelled-work-size-per-package = 10
max-failed-work-size-per-package = 10
max-pending-tasks-per-package = 150
max-pending-tasks-system = 6000
max-execution-time = 10
system-retry-time = 10

[events-allowlist]
events-list = [
    "event://com.amazon.wifi/state/connected",
    "event://com.amazon.maplite/map/device-register",
    "event://com.amazon.maplite/map/device-deregister",
]
