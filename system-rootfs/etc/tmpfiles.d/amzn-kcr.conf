## Fix file permission for amzn_kcr.service
Z       /var/lib/systemd/pstore/*         0640    log     log     -
T       /var/lib/systemd/pstore/*         -       -       -       -       security.SMACK64="System"

## KCR cache directory (persists across OTA and factory reset)
d       /cache/kcr                        0770    root    log     -
T       /cache/kcr                        -       -       -       -       security.SMACK64="System"
