d       /var/lib/pkgmgrd               -       -       -          -
t       /var/lib/pkgmgrd               -       -       -          -        security.SMACK64="System::Shared"

d       /var/lib/pkgmgrd/packages               0750       pkgmgr       package          -
t       /var/lib/pkgmgrd/packages               -       -       -          -        security.SMACK64="System::Shared"

d       /var/lib/pkgmgrd/downloads              0770       pkgmgr       downloadmgr          -
t       /var/lib/pkgmgrd/downloads              -       -       -          -        security.SMACK64="System"

d       /home/app_user                  0770    app_user system     -
t       /home/app_user                  -       -        -          -       security.SMACK64="System::Shared"
t       /home/app_user                  -       -        -          -       security.SMACK64TRANSMUTE="TRUE"

# Developers will be able to push files in release builds to this folder.
# Apps will bind mount this directory as read-only in their sandbox.
d      /tmp/scratch        0755    app_user app_user     -
t      /tmp/scratch        -       -        -          -       security.SMACK64="*"

# Debug configuration files are created under this directory and used to configure
# tooling in developer mode
d      /var/lib/developer     0755    app_user app_user     -
t      /var/lib/developer     -       -        -            -       security.SMACK64="*"

# Resource Manager's scheduler interface files
R      /var/lib/resmgr/schedule         -       -        -            -        -

d      /var/lib/resmgr                  0755    root     root         -
d      /run/resmgr                      0755    root     root         -
d      /run/resmgr/schedule             0644    root     root         -
f      /run/resmgr/schedule/type.stem   0644    root     root         -        1

L      /var/lib/resmgr/schedule - - - - /run/resmgr/schedule

# Resource Manager's log level control
d      /run/resmgr/loglevel                       0644    root     root         -
f      /run/resmgr/loglevel/99-rm-loglevel.conf   0644    root     root         -

L      /etc/systemd/journald.conf.d/99-rm-loglevel.conf - - - - /run/resmgr/loglevel/99-rm-loglevel.conf

# Failure Manager's custom failure API
d      /var/lib/failure-manager/custom-failure    3730    failuremgr     failuremgr         -
