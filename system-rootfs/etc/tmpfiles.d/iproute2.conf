# for iproute2 /run/iproute2/rt_table is accessible by netsvc
#Type   Path                 Mode    User    Group   Age     Argument
d       /run/iproute2        2770    root    wifi     -
t       /run/iproute2         -       -       -       -       security.SMACK64="System"
t       /run/iproute2         -       -       -       -       security.SMACK64TRANSMUTE="TRUE"
f       /run/iproute2/rt_tables    660     root     wifi      -
t       /run/iproute2/rt_tables     -       -       -       -       security.SMACK64="System"

