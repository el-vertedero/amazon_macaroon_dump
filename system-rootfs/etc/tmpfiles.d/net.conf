# Remove first line once move to volatile location
d                /var/lib/wifi                            2770       root       wifi       -
d                /var/lib/wifi/keystore                   2770       root       wifi       -
T                /var/lib/wifi                            -          -          -          -          security.SMACK64="System"
# for dhcp server dnsmasq to keep lease across device reboot
d                /var/lib/dnsmasq                         2770       root       net        -
t                /var/lib/dnsmasq                         -          -          -          -          security.SMACK64="System"
t                /var/lib/dnsmasq                         -          -          -          -          security.SMACK64TRANSMUTE="TRUE"
d                /run/hostap                              2770       root       wifi       -
T                /run/hostap                              -          -          -          -          security.SMACK64="System"
d                /run/network                             2770       root       wifi       -
T                /run/network                             -          -          -          -          security.SMACK64="System"
f                /run/xtables.lock                        0660       root       wifi       -
t                /run/xtables.lock                        -          -          -          -          security.SMACK64="System"
d                /run/gai                                 2770       root       wifi       -
t                /run/gai                                 -          -          -          -          security.SMACK64="System"
t                /run/gai                                 -          -          -          -          security.SMACK64TRANSMUTE="TRUE"
f                /run/gai/gai.conf                        0660       root       wifi       -
t                /run/gai/gai.conf                        -          -          -          -          security.SMACK64="System"
