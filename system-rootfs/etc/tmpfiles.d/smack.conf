# conf file for tmpfiles.d
# Check the manpage for more information https://www.freedesktop.org/software/systemd/man/tmpfiles.d.html

#Type	Path		Mode	User	Group	Age	Argument
d       /var/db         0755    root    root    -
t       /var/db         -       -       -       -       security.SMACK64="_"
t       /var/lib        -       -       -       -       security.SMACK64="_"
d       /var/log        2770    root    log     -
T       /var/log        -       -       -       -       security.SMACK64="System::Log"
t       /var/log        -       -       -       -       security.SMACK64TRANSMUTE="TRUE"
t       /var/log/btmp   -       -       -       -       security.SMACK64="System"
t       /var/log/lastlog -       -       -       -      security.SMACK64="System"
T       /var/log/private -       -       -       -      security.SMACK64="System"
t       /var/log/wtmp   -       -       -       -       security.SMACK64="System"
d       /var/non-secure 0755    root    root    -
t       /var/non-secure -       -       -       -       security.SMACK64="*"
d       /var/volatile/log       2770    root    log     -
T       /var/volatile/log       -       -       -       -       security.SMACK64="System::Log"
t       /var/volatile/log       -       -       -       -       security.SMACK64TRANSMUTE="TRUE"
t       /var/tmp        -       -       -       -       security.SMACK64="*"
t       /var/volatile/tmp       -       -       -       -       security.SMACK64="*"
t       /tmp            -       -       -       -       security.SMACK64="*"
t       /home           -       -       -       -       security.SMACK64="User::Home"
T       /run/log        -       -       -       -       security.SMACK64="System::Log"
T       /run/log        -       -       -       -       security.SMACK64TRANSMUTE="TRUE"
t       /run/user       -       -       -       -       security.SMACK64="System::Shared"
t       /run/systemd    -       -       -       -       security.SMACK64="System::Shared"
t       /run/systemd/journal    -       -       -       -       security.SMACK64="System::Shared"
d       /run/dbus       0755    root    system  -
t       /run/dbus       -       -       -       -       security.SMACK64="System::Shared"

# For status file storages for services
T	/var/lib/bluetooth	-	-	-	-	security.SMACK64="System"
t	/var/lib/data	-	-	-	-	security.SMACK64="System::Shared"
T	/var/lib/data/puffinmrmd	-	-	-	-	security.SMACK64="System"
t	/var/lib/logrotate.status   -       -       -       -       security.SMACK64="System"
T	/var/lib/private	-	-	-	-	security.SMACK64="System"
t	/var/lib/private	-	-	-	-	security.SMACK64TRANSMUTE="TRUE"
t	/sys/power/state	-	-	-	-	security.SMACK64="System"
t	/sys/power/wakeup_count	-	-	-	-	security.SMACK64="System"
t	/sys/devices/system/cpu/cpufreq/policy0/scaling_governor	-	-	-	-	security.SMACK64="System"
