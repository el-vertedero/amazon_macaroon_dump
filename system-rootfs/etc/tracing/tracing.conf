# Configuration file for tracing_service.service
# Configuration file is sourced from service init script
#
# Configuration Mode
#CONFIG_MODE="LOCAL"
CONFIG_MODE="KVS"

# Local Session Configuration
CLI_STAT_ARGS="app_trace,proc_mem,sys_mem,sys_vmstat,sys_stat,disk_io_stats"
CLI_TRIGGER_ARGS="UserPerceivedLatency.WakeWordToBar.UXEventD.PlayUxEventToPlayAnimation,
    UserPerceivedLatency.Audio.WakeWordToBar.PlayUxEventToLight,
    UserPerceivedLatency.Audio.WakeWordToBar.KeywordDetectedToLight,
    UserPerceivedLatency.Audio.WakeWordToBar.KeywordDetectedToRecognizing,
    UserPerceivedLatency.Audio.TimeToLightUPL,
    UserPerceivedLatency.Audio.WakeWordToBar.KeywordDetectedToPlayUxEvent,
    UserPerceivedLatency.Audio.WakeWordToBar.EndofWWToKeywordDetected,
    UserPerceivedLatency.Audio.WakeWordToBar,
    UserPerceivedLatency.Audio.WakeWordToBar.KeywordDetectedToUploadStart,
    UserPerceivedLatency.Audio,
    UserPerceivedLatency.Audio.DeviceProcessing,
    UserPerceivedLatency.Audio.DeviceProcessing.DispatchToFirstByteOfAudio,
    UserPerceivedLatency.Audio.DeviceProcessing.FirstByteToParseComplete,
    UserPerceivedLatency.Audio.DeviceProcessing.ParseCompleteToDispatch,
    UserPerceivedLatency.Audio.DeviceProcessing.TtsMediaPreparation,
    UserPerceivedLatency.Audio.ServerProcessing,
    UserPerceivedLatency.Audio.ServerProcessing.StopCaptureToFirstByte,
    UserPerceivedLatency.Audio.ServerProcessing.UtteranceEndToStopCapture"

# Default support for user tracing
#LOCAL_TRACING_TYPE=USER_TRACE
#LOCAL_TRACING_TYPE=BOOT_TRACE
#LOCAL_TRACING_TYPE=AUTO_TRACE

# Default polling time period
LOCAL_TRACING_POLLING_PERIOD=250

# Default boot recording duration
LOCAL_TRACING_BOOT_DUR=30
