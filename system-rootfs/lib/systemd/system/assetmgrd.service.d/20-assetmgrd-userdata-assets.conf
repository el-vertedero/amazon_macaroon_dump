[Service]

ExecStartPre=+/bin/mkdir -p /var/non-secure/userdata-assets/davs \
    /var/non-secure/userdata-assets/davs/requests \
    /var/non-secure/userdata-assets/davs/resources \
    /var/non-secure/userdata-assets/davs/tmp \
    /var/non-secure/userdata-assets/davs/url \
    /var/non-secure/userdata-assets/davs/urlWorkingDir

ExecStartPre=+/bin/chmod -R 0770 /var/non-secure/userdata-assets/davs

ExecStartPre=+/bin/chown -R root:assetmgr /var/non-secure/userdata-assets/davs

ExecStartPre=+/usr/bin/chsmack -t -r -a 'System::Shared' /var/non-secure/userdata-assets/davs

ExecStartPre=+/usr/bin/create-asset-symlink /var/non-secure/userdata-assets/davs/resources /var/lib/data/davs/resources
ExecStartPre=+/usr/bin/create-asset-symlink /var/non-secure/userdata-assets/davs/requests /var/lib/data/davs/requests

