# Required for any tracing any category with Vtrace
data_sources {
  config {
    name: "track_event"
  }
}

# Enable all categories by default for VTRACE_<...> traces. To enable only
# select categories, use the "enabled_categories" field.
# The below field "for_testing" has been repurposed to let the user enable/disable
# a workaround for missing traces for each thread. The value in field_uint64
# is a bitmask for VTRACE trace types.
# The enumeration of VTRACE trace types is as follows:
# enum { VTRACE, VTRACE_META, VTRACE_END, VTRACE_END_TS, VTRACE_INT32, VTRACE_INT32_META,
#        VTRACE_INT64, VTRACE_INT64_META, VTRACE_FLOAT, VTRACE_FLOAT_META, VTRACE_DOUBLE,
#        VTRACE_DOUBLE_META, VTRACE_BEGIN, VTRACE_BEGIN_META, VTRACE_BEGIN_TS,
#        VTRACE_BEGIN_TS_META, VTRACE_BEGIN_STR, VTRACE_BEGIN_STR_META }
# The enumeration of VT_KPI trace types is as follows:
# enum { VT_KPI_INT32, VT_KPI_INT32_META, VT_KPI_INT64, VT_KPI_INT64_META, VT_KPI_FLOAT,
#        VT_KPI_FLOAT_META, VT_KPI_DOUBLE, VT_KPI_DOUBLE_META, VT_KPI_END, VT_KPI_END_META,
#        VT_KPI_BEGIN, VT_KPI_BEGIN_META }
# For example, a value of "field_uint64: 4095" implies workaround enabled for first
# 12 trace types. Note that there will be dummy trace packets inserted for each trace packet
# which has this workaround enabled.

data_sources {
  config {
    name: "vtrace_data_source"
  }
}

# Enable all categories by default for VT_KPI_<...> traces. To enable only
# select categories, use the "enabled_categories" field.
data_sources {
  config {
    name: "vtrace_kpi_data_source"
  }
}

# Capture duration in milliseconds. Default to capture indefinitely until the session is
# terminated. Uncomment the below line to capture for a specific period of time.
# duration_ms: 10000
