# This is a default sample trace config file used for tracing using
# Perfetto.

# One buffer allocated within the central tracing binary for the entire trace,
# shared by the two data sources below.
buffers {
  size_kb: 32768
  fill_policy: RING_BUFFER
}

# Ftrace data from the kernel, mainly the process scheduling events.
data_sources {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "task_newtask"
      ftrace_events: "task_rename"
    }
  }
}

# Process stat polling traces
# Time period specified of 100000ms (100sec)
data_sources {
  config {
    name: "linux.process_stats"
    target_buffer: 0
    process_stats_config {
      scan_all_processes_on_start: true
      proc_stats_poll_ms: 100000
    }
  }
}

# Required for any tracing any category with Vtrace
data_sources {
  config {
    name: "track_event"
  }
}

# Enable all categories by default for VTRACE_<...> traces. To enable only
# select categories, use the "enabled_categories" field.
data_sources {
  config {
    name: "vtrace_data_source"
  }
}

# Enable all categories by default for VT_KPI_<...> traces. To enable only
# select categories, use the "enabled_categories" field.
data_sources {
  config {
    name: "vtrace_kpi_data_source"
  }
}

# Capture duration in milliseconds. Default to capture indefinitely until the session is
# terminated. Uncomment the below line to capture for a specific period of time.
# duration_ms: 10000
