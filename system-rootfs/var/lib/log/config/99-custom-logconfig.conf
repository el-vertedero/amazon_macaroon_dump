# This file overrides the default setting journald.conf
# LogConfig overrides the settings to configure logging
# behavior to enable dev-mode features.
# 
# Location: /etc/systemd/journald.conf.d/
#
# For priority of various directories see:
# https://www.freedesktop.org/software/systemd/man/latest/systemd.

[Journal]
MaxLevelStore=info
RateLimitBurst=100
